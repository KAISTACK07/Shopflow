# Alembic config. The database URL is not here: env.py reads it from app settings (DATABASE_URL).
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Files are named <rev>_<slug>.py; we pass readable revision ids like 0001 with --rev-id.
file_template = %%(rev)s_%%(slug)s
