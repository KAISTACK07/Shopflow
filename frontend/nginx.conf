# Serves the built React app and forwards /api to the backend container. Same origin for the browser: no CORS.

# Keep the caller's X-Request-ID if it sent one; otherwise use nginx's own request id, so one id follows the
# request from nginx's log into the backend's JSON logs.
map $http_x_request_id $request_id_to_forward {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. They must live at server level only: nginx drops ALL inherited add_header directives in a
    # location that has an add_header of its own, so the locations below use `expires` for caching instead.
    # The CSP allows only our own scripts plus Google Fonts; it limits what an injected script (XSS) could load
    # or where it could send data, which matters because the login token is in localStorage.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        # Resolve the backend's address through Docker's DNS at request time (the variable forces this). With a
        # plain `proxy_pass http://backend:8000;` nginx resolves once at startup, and recreating the backend
        # container (new IP) would leave nginx sending traffic to a dead address: 502s until nginx restarts.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_to_forward;
        proxy_read_timeout 30s;
    }

    # Built assets have content hashes in their names (index-DnBlcejU.js), so they can be cached for a year.
    location /assets/ {
        expires 1y;
    }

    # Single-page app: any other path (/orders, /products/7) returns index.html and React Router shows the page.
    # index.html itself must not be cached, or users would keep loading old asset names after a deploy.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
